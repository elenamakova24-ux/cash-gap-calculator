<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хватит ли денег на платёж | Деньги под контролем</title>
<meta name="description" content="Посчитайте остаток после ближайшего платежа с учётом поступлений и других расходов до его даты">
</head>
<body style="margin:0;padding:24px 16px">
<style>
  .cgc-wrap {
    --cgc-text: #1A1A1A;
    --cgc-text-muted: #6B6B66;
    --cgc-border: #E3E1D9;
    --cgc-bg-soft: #F4F1EA;
    --cgc-accent: #0F6E56;
    --cgc-accent-text: #FFFFFF;
    --cgc-danger-bg: #FCEBEB;
    --cgc-danger-border: #F0997B;
    --cgc-danger-text: #791F1F;
    --cgc-warning-bg: #FAEEDA;
    --cgc-warning-border: #EF9F27;
    --cgc-warning-text: #633806;
    --cgc-success-bg: #EAF3DE;
    --cgc-success-border: #97C459;
    --cgc-success-text: #27500A;

    max-width: 520px;
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--cgc-text);
    box-sizing: border-box;
  }
  .cgc-wrap * { box-sizing: border-box; }

  .cgc-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .cgc-title { font-size: 19px; font-weight: 600; line-height: 1.3; }
  .cgc-subtitle { font-size: 14px; color: var(--cgc-text-muted); margin: 0 0 24px; line-height: 1.6; }

  .cgc-field { margin-bottom: 14px; }
  .cgc-label { font-size: 13px; color: var(--cgc-text-muted); display: block; margin-bottom: 5px; }
  .cgc-input {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--cgc-border);
    border-radius: 8px;
    font-size: 15px;
    color: var(--cgc-text);
    background: #fff;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .cgc-input:focus { border-color: var(--cgc-accent); }

  .cgc-btn {
    width: 100%;
    height: 46px;
    margin-top: 8px;
    background: var(--cgc-accent);
    color: var(--cgc-accent-text);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .cgc-btn:hover { opacity: 0.9; }
  .cgc-btn:active { transform: scale(0.99); }

  .cgc-result { display: none; margin-top: 24px; }

  .cgc-result-card {
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid;
  }
  .cgc-result-card.danger { background: var(--cgc-danger-bg); border-color: var(--cgc-danger-border); }
  .cgc-result-card.warning { background: var(--cgc-warning-bg); border-color: var(--cgc-warning-border); }
  .cgc-result-card.success { background: var(--cgc-success-bg); border-color: var(--cgc-success-border); }

  .cgc-result-head { font-weight: 600; font-size: 15px; margin: 0 0 8px; line-height: 1.4; }
  .cgc-result-card.danger .cgc-result-head { color: var(--cgc-danger-text); }
  .cgc-result-card.warning .cgc-result-head { color: var(--cgc-warning-text); }
  .cgc-result-card.success .cgc-result-head { color: var(--cgc-success-text); }

  .cgc-result-body { font-size: 14px; color: var(--cgc-text-muted); margin: 0; line-height: 1.6; }

  .cgc-cta-card {
    margin-top: 12px;
    padding: 18px 20px;
    background: var(--cgc-bg-soft);
    border-radius: 12px;
  }
  .cgc-cta-text { font-size: 14px; margin: 0 0 10px; line-height: 1.6; }
  .cgc-cta-bold { font-weight: 600; }

  .cgc-cta-link {
    display: inline-block;
    width: 100%;
    text-align: center;
    height: 46px;
    line-height: 46px;
    background: var(--cgc-accent);
    color: var(--cgc-accent-text) !important;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none !important;
    box-sizing: border-box;
  }
  .cgc-cta-link:hover { opacity: 0.9; }

  .cgc-empty {
    background: var(--cgc-bg-soft);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--cgc-text-muted);
  }

  @media (max-width: 480px) {
    .cgc-title { font-size: 17px; }
  }
</style>

<div class="cgc-wrap">

  <div class="cgc-title-row">
    <span class="cgc-title">Хватит ли денег на ближайший платёж</span>
  </div>
  <p class="cgc-subtitle">Выберите дату платежа. Учитывайте только деньги, которые поступят или уйдут до него, включая операции в тот же день до оплаты. Суммы указывайте в одной валюте</p>

  <div class="cgc-field">
    <label class="cgc-label" for="cgc-balance">Сколько денег на всех счетах сейчас?</label>
    <input class="cgc-input" type="number" min="0" step="0.01" id="cgc-balance" placeholder="например, 350000" />
  </div>

  <div class="cgc-field">
    <label class="cgc-label" for="cgc-income">Сколько поступит до выбранного платежа?</label>
    <input class="cgc-input" type="number" min="0" step="0.01" id="cgc-income" placeholder="без оплат, ожидаемых после платежа" />
  </div>

  <div class="cgc-field">
    <label class="cgc-label" for="cgc-expenses">Сколько других расходов предстоит до этого платежа?</label>
    <input class="cgc-input" type="number" min="0" step="0.01" id="cgc-expenses" placeholder="не включайте платёж, указанный ниже" />
  </div>

  <div class="cgc-field">
    <label class="cgc-label" for="cgc-bigdate">Дата ближайшего крупного платежа</label>
    <input class="cgc-input" type="date" id="cgc-bigdate" />
  </div>

  <div class="cgc-field">
    <label class="cgc-label" for="cgc-bigsum">Сумма этого платежа</label>
    <input class="cgc-input" type="number" min="0" step="0.01" id="cgc-bigsum" placeholder="например, зарплата 5 числа" />
  </div>

  <button class="cgc-btn" id="cgc-calc-btn" type="button">Посчитать</button>

  <div class="cgc-result" id="cgc-result" aria-live="polite"></div>

</div>

<script>
(function () {
  function fmt(n) {
    return n.toLocaleString('ru-RU', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  }
  var btn = document.getElementById('cgc-calc-btn');
  btn.addEventListener('click', function () {
    var wrap = document.getElementById('cgc-result');
    function error(message) {
      wrap.style.display = 'block';
      wrap.innerHTML = '<div class="cgc-empty">' + message + '</div>';
    }
    var ids = ['balance', 'income', 'expenses', 'bigsum'];
    var values = ids.map(function (id) { return document.getElementById('cgc-' + id).value; });
    if (values.some(function (value) { return value.trim() === ''; })) {
      error('Заполните все суммы. Если поступлений или других расходов нет, укажите 0');
      return;
    }
    var amounts = values.map(Number);
    if (amounts.some(function (value) { return !Number.isFinite(value) || value < 0; })) {
      error('Укажите неотрицательные конечные суммы');
      return;
    }
    if (amounts[3] <= 0) {
      error('Сумма выбранного платежа должна быть больше нуля');
      return;
    }
    var bigDate = document.getElementById('cgc-bigdate').value;
    var target = new Date(bigDate + 'T00:00:00');
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    if (!bigDate || !Number.isFinite(target.getTime()) || target < today) {
      error('Выберите сегодняшнюю или будущую дату платежа');
      return;
    }
    var afterPayment = Math.round((amounts[0] + amounts[1] - amounts[2] - amounts[3]) * 100) / 100;
    if (!Number.isFinite(afterPayment)) {
      error('Суммы слишком велики для расчёта');
      return;
    }
    var dateLabel = target.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});
    var kind = afterPayment < 0 ? 'danger' : afterPayment === 0 ? 'warning' : 'success';
    var headline = afterPayment < 0
      ? 'К платежу ' + dateLabel + ' не хватает ' + fmt(-afterPayment)
      : 'После платежа ' + dateLabel + ' останется ' + fmt(afterPayment);
    var html = '<div class="cgc-result-card ' + kind + '">'
      + '<p class="cgc-result-head">' + headline + '</p>'
      + '<p class="cgc-result-body">Остаток сейчас + поступления до платежа - другие расходы до него - сам платёж. Результат в той же валюте, что и введённые суммы</p>'
      + '</div>'
      + '<div class="cgc-cta-card">'
      + '<p class="cgc-cta-text">Это расчёт на одну дату. Он не проверяет остаток в каждый день до неё. Если клиент заплатит позже, пересчитайте результат без этой суммы</p>'
      + '<p class="cgc-cta-text">В канале «Деньги под контролем с ИИ» рассказываю о таблицах, отчётах и учёте денег для экспертов</p>'
      + '<a href="https://t.me/AI_makova" class="cgc-cta-link" target="_blank" rel="noopener noreferrer">Перейти в канал</a>'
      + '<p class="cgc-cta-text" style="margin-top:12px;margin-bottom:0">Неясно, что включить в расчёт? <a href="https://t.me/ai_finans" target="_blank" rel="noopener noreferrer">Задать вопрос Елене</a></p>'
      + '</div>';
    wrap.style.display = 'block';
    wrap.innerHTML = html;
  });
})();
</script>
</body>
</html>
